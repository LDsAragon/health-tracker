# CI: tests en cada push/PR + tarball de Linux como artifact descargable.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  tarball-linux:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/make_release_linux.sh
      # El tarball se arma copiando archivos: si falta un modulo, pytest no lo ve
      # (corre sobre el repo) y la app no arranca. Paso con updater.py desde
      # v2026-06-25 y no se noto por dos meses.
      - name: el tarball arranca
        run: |
          pip install -r requirements.txt
          tmp=$(mktemp -d)
          tar -xzf dist/Bitacora-linux-*.tar.gz -C "$tmp"
          cd "$tmp/Bitacora"
          python -c "from bitacora.app import create_app; create_app(); print('el tarball importa y crea la app')"
      - uses: actions/upload-artifact@v4
        with:
          name: bitacora-linux
          path: dist/Bitacora-linux-*.tar.gz
