<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Calendario{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="navbar">
    <a href="{{ url_for('calendar_view') }}" class="nav-brand">Calendario</a>
    <a href="{{ url_for('recurring_view') }}"
       class="nav-link {% if request.endpoint == 'recurring_view' %}active{% endif %}">
      Eventos recurrentes
    </a>
  </nav>
  <main class="{% block main_class %}main{% endblock %}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
