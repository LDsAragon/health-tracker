<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Calendario{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="navbar">
    <a href="{{ url_for('calendar_view') }}" class="nav-brand">Calendario</a>

    <form class="nav-search" action="{{ url_for('search_view') }}" method="GET">
      <input type="text" name="q" class="nav-search-input"
             placeholder="Buscar notas..."
             value="{{ request.args.get('q', '') if request.endpoint == 'search_view' else '' }}">
    </form>

    <div class="nav-links">
      <a href="{{ url_for('recurring_view') }}"
         class="nav-link {% if request.endpoint == 'recurring_view' %}active{% endif %}">
        Eventos
      </a>
      <a href="{{ url_for('journal_view') }}"
         class="nav-link {% if request.endpoint == 'journal_view' %}active{% endif %}">
        Registros
      </a>
      <a href="{{ url_for('export_view') }}"
         class="nav-link {% if request.endpoint in ('export_view', 'export_download') %}active{% endif %}">
        Exportar
      </a>
    </div>
  </nav>
  <main class="{% block main_class %}main{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='js/emotion-wheel.js') }}"></script>
  <script src="{{ url_for('static', filename='js/emotion-wheel-content.js') }}"></script>
  <script src="{{ url_for('static', filename='js/emotion-wheel-visual.js') }}"></script>

  <div id="ew-modal" class="ew-modal-overlay" style="display:none;" onclick="ewOverlayClick(event)">
    <div class="ew-modal-box">
      <div class="ew-modal-main">
        <div class="ew-wheel-wrap">
          <svg id="ew-svg" viewBox="-180 -180 360 360" width="600" height="600"></svg>
          <div id="ew-center-label" class="ew-center-label"></div>
        </div>
        <div class="ew-hover-label" id="ew-hover-label"></div>
        <div class="ew-hover-hint" id="ew-hover-hint">Rotá para explorar · hover para ver · click para guardar</div>
        <div class="ew-modal-actions">
          <button onclick="closeEWModal()">Cancelar</button>
        </div>
        <p class="ew-hint">Q / ← rotar izq &nbsp;·&nbsp; E / → rotar der &nbsp;·&nbsp; Esc cancelar</p>
      </div>
      <aside class="ew-info-panel" id="ew-info-panel"></aside>
    </div>
  </div>
</body>
</html>
