<!DOCTYPE html>
<html lang="es" data-theme="{{ settings.theme }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Calendario{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/calendar.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/day.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/wheel.css') }}">
</head>
<body>
  <nav class="navbar">
    <a href="{{ url_for('main.home') }}" class="nav-brand">Calendario</a>

    <form class="nav-search" action="{{ url_for('main.search_view') }}" method="GET">
      <input type="text" name="q" class="nav-search-input"
             placeholder="Buscar notas..."
             value="{{ request.args.get('q', '') if request.endpoint == 'main.search_view' else '' }}">
    </form>

    <div class="nav-links">
      <a href="{{ url_for('recurring.recurring_view') }}"
         class="nav-link {% if request.endpoint == 'recurring.recurring_view' %}active{% endif %}">
        Rutinas
      </a>
      <a href="{{ url_for('journal.journal_view') }}"
         class="nav-link {% if request.endpoint == 'journal.journal_view' %}active{% endif %}">
        Notas especiales
      </a>
      <a href="{{ url_for('main.export_view') }}"
         class="nav-link {% if request.endpoint in ('main.export_view', 'main.export_download') %}active{% endif %}">
        Exportar
      </a>
      <a href="{{ url_for('main.settings_view') }}"
         class="nav-link {% if request.endpoint in ('main.settings_view', 'main.settings_save') %}active{% endif %}">
        ⚙️ Ajustes
      </a>
    </div>
  </nav>
  <main class="{% block main_class %}main{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='js/emotion-wheel.js') }}"></script>
  <script src="{{ url_for('static', filename='js/emotion-wheel-content.js') }}"></script>
  <script src="{{ url_for('static', filename='js/ekman-wheel.js') }}"></script>
  <script src="{{ url_for('static', filename='js/ekman-wheel-content.js') }}"></script>
  <script src="{{ url_for('static', filename='js/emotion-wheel-visual.js') }}"></script>
  <script>window.DATE_FMT = "{{ settings.date_format }}"; window.TIME_FMT = "{{ settings.time_format }}";</script>
  <script src="{{ url_for('static', filename='js/time-fields.js') }}"></script>
  <script src="{{ url_for('static', filename='js/field-blocks.js') }}"></script>
  <script src="{{ url_for('static', filename='js/field-registry.js') }}"></script>
  <script src="{{ url_for('static', filename='js/date-es.js') }}"></script>

  <div id="ew-modal" class="ew-modal-overlay" style="display:none;" onclick="ewOverlayClick(event)">
    <div class="ew-modal-box">
      <div class="ew-modal-main">
        <div class="ew-wheel-tabs">
          <button type="button" class="ew-wheel-tab active" data-wheel="es" onclick="ewSwitchWheel('es')">Willcox</button>
          <button type="button" class="ew-wheel-tab" data-wheel="ek" onclick="ewSwitchWheel('ek')">Ekman</button>
        </div>
        <div class="ew-wheel-wrap">
          <svg id="ew-svg" viewBox="-180 -180 360 360" width="600" height="600"></svg>
          <div id="ew-center-label" class="ew-center-label"></div>
        </div>
        <div class="ew-hover-label" id="ew-hover-label"></div>
        <div class="ew-hover-hint" id="ew-hover-hint">Rotá para explorar · hover para ver · click para guardar</div>
        <div class="ew-modal-actions">
          <button onclick="closeEWModal()">Cancelar</button>
        </div>
        <p class="ew-hint">Q / ← rotar izq &nbsp;·&nbsp; E / → rotar der &nbsp;·&nbsp; Esc cancelar</p>
      </div>
      <aside class="ew-info-panel" id="ew-info-panel"></aside>
    </div>
  </div>
</body>
</html>
